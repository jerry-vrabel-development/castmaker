name: Content suggestion
description: A new table entry, a line that reads badly, or a character that doesn't hang together.
labels: [content]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: The new or changed text. Original writing only, since content is licensed CC BY 4.0.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it goes
      placeholder: e.g. fantasy upbringings, quirks, deep fears
  - type: input
    id: seed
    attributes:
      label: Seed (if it's about a rolled character)
